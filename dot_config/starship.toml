# Modified from https://starship.rs/presets/catppuccin-powerline
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'

format = """
$time\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$c\
$cpp\
$cmake\
$python\
$lua\
$conda\
$docker_context\
$cmd_duration
$line_break\
$character
"""

[time]
disabled = false
# symbol = "  "
time_format = "%R"
style = "fg:mauve"
format = '[$time]($style)'

[os]
disabled = false
style = "fg:maroon"
format = '[ ❯ ](fg:rosewater)[$symbol ]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:maroon"
style_root = "fg:maroon"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:maroon"
format = '[@$hostname]($style)'

[directory]
style = "fg:sky"
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
format = "[ ❯ ](fg:rosewater)[$path]($style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:yellow"
format = '[ ❯ ](fg:rosewater)[$symbol $branch]($style)'

[git_commit]
style = "fg:yellow"
commit_hash_length = 7
tag_symbol = '󰓽 '
tag_disabled = false
format = '[ \($hash $tag\)]($style)'

[git_state]
style = "fg:yellow"
rebase = '󱓎 REBASING'
merge = ' MERGING'
revert = '󰕍 REVERTING'
cherry_pick = '🍒 PICKING'
bisect = '󰃻 BISECTING'
am = '󱡯  AM'
am_or_rebase = '󱓎 AM/REBASE'
format = '[\($state($progress_current of $progress_total)\) ]($style)'

[git_status]
style = "fg:yellow"
format = '[($all_status$ahead_behind) ]($style)'

[c]
symbol = ""
style = "fg:green"
format = '[ ❯ ](fg:rosewater)[$symbol ($version)]($style)'

[cpp]
symbol = " ++"
disabled = false
style = "fg:green"
format = '[ ❯ ](fg:rosewater)[$symbol ($version)]($style)'

[cmake]
symbol = "△"
disabled = false
style = "fg:green"
format = '[ ❯ ](fg:rosewater)[$symbol ($version)]($style)'

[python]
symbol = ""
style = "fg:green"
format = '[ ❯ ](fg:rosewater)[$symbol ($version)( \(($virtualenv)\))]($style)'

[lua]
symbol = "🌙"
style = "fg:green"
format = '[ ❯ ](fg:rosewater)[$symbol ($version)]($style)'

[docker_context]
symbol = ""
style = "fg:sapphire"
format = '[ ❯ ](fg:rosewater)[$symbol ($context)]($style)'

[conda]
symbol = " "
style = "fg:sapphire"
format = '[ ❯ ](fg:rosewater)[$symbol $environment]($style)'
ignore_base = false

[cmd_duration]
style = "fg:lavender"
min_time = 2_000
show_milliseconds = false
disabled = false
format = '[ ❯ ](fg:rosewater)[󰔛 in $duration]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[line_break]
disabled = true

